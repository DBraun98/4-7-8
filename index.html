<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-7-8 Atemtechnik</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f4f8;
      font-family: sans-serif;
    }
    h1 {
      margin-bottom: 2rem;
      font-size: 1.5rem;
      color: #333;
    }
    #circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #1e6449;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.2rem;
      transition: all ease-in-out;
    }
  </style>
</head>
<body>
  <h1>4-7-8 Atemtechnik</h1>
  <div id="circle">Start</div>

  <script>
    const circle = document.getElementById('circle');
    
    async function breathCycle() {
      // Einatmen 4 Sekunden
      circle.textContent = "Einatmen";
      circle.style.transform = "scale(1.4)";
      await new Promise(r => setTimeout(r, 4000));

      // Halten 7 Sekunden
      circle.textContent = "Halten";
      circle.style.transform = "scale(1.2)";
      await new Promise(r => setTimeout(r, 7000));

      // Ausatmen 8 Sekunden
      circle.textContent = "Ausatmen";
      circle.style.transform = "scale(1)";
      await new Promise(r => setTimeout(r, 8000));

      // Nächster Zyklus
      breathCycle();
    }

    // Starte nach Klick auf den Kreis
    circle.addEventListener('click', () => {
      breathCycle();
    }, { once: true });
  </script>
</body>
</html>
